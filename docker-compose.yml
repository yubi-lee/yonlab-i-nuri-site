services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yonlearn
      POSTGRES_USER: yonlearn
      POSTGRES_PASSWORD: yonlearn
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yonlearn"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://yonlearn:yonlearn@postgres:5432/yonlearn
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 4s
      retries: 10
  frontend:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports: ["8080:80"]
volumes:
  postgres_data:
